<title>Mapa do predimref</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
  /* Folha de processo: duas faixas lidas da esquerda para a direita (A dentro da rotina, B depois dela);
     um fio de cobre carrega os números do caso real; laços de iteração em tracejado azul-aço.
     Visual único e claro, de propósito: é uma folha para projetar e imprimir. */
  :root {
    --papel: #f2f5f4;
    --painel: #e5ebea;
    --tinta: #172226;
    --tinta-2: #3e4b50;
    --regua: #c3cdcf;
    --aleta: #9aa6aa;
    --cobre: #b4602b;
    --cobre-tinta: #7a3b12;
    --laco: #245d73;
    --f-texto: "Barlow Semi Condensed", "Arial Narrow", "Roboto Condensed", system-ui, sans-serif;
    --f-mono: "JetBrains Mono", "DejaVu Sans Mono", ui-monospace, monospace;
    color-scheme: light;
  }
  html, body { background: var(--papel); color: var(--tinta); }
  body { font-family: var(--f-texto); padding-left: max(16px, env(safe-area-inset-left, 0px));
         padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px; }
  .folha { max-width: 1920px; margin: 0 auto; }
  .rolagem { overflow-x: auto; }
  svg.mapa { display: block; width: 100%; min-width: 1180px; height: auto; max-height: calc(100vh - 32px);
             background: var(--papel); font-family: var(--f-texto); fill: var(--tinta); }
  figure { margin: 0; }
  figcaption { font-size: 15px; color: var(--tinta-2); max-width: 70ch; padding-top: 10px; line-height: 1.45; }

  .mapa .eyebrow { font-size: 14px; font-weight: 600; letter-spacing: .14em; fill: var(--tinta-2); }
  .mapa .titulo { font-size: 42px; font-weight: 600; letter-spacing: -.005em; }
  .mapa .marca { font-family: var(--f-mono); font-weight: 600; font-size: 38px; }
  .mapa .tese { font-size: 20px; font-weight: 500; }
  .mapa .secao { font-size: 14px; font-weight: 700; letter-spacing: .14em; }
  .mapa .secao-nota { font-size: 15.5px; fill: var(--tinta-2); font-weight: 500; letter-spacing: 0; }
  .mapa .letra { font-size: 14px; font-weight: 700; fill: var(--papel); }
  .mapa .rot { font-size: 13.5px; font-weight: 600; letter-spacing: .13em; fill: var(--tinta-2); }
  .mapa .num { font-size: 15px; font-weight: 700; }
  .mapa .perg { font-size: 19.5px; font-weight: 600; }
  .mapa .valor { font-family: var(--f-mono); font-size: 20px; font-weight: 600; fill: var(--cobre-tinta); }
  .mapa .det { font-size: 15px; font-weight: 500; }
  .mapa .met { font-size: 14.5px; fill: var(--tinta-2); }
  .mapa .eixo { font-size: 13.5px; fill: var(--tinta-2); }
  .mapa .eixo-cobre { font-size: 13.5px; fill: var(--cobre-tinta); font-weight: 600; }
  .mapa .laco-t { font-size: 14.5px; fill: var(--laco); font-weight: 600; }
  .mapa .ent-v { font-family: var(--f-mono); font-size: 22px; font-weight: 600; }
  .mapa .ent-r { font-size: 14.5px; fill: var(--tinta-2); }
  .mapa .opc { font-size: 14.5px; }
  .mapa .saida-v { font-family: var(--f-mono); font-size: 21px; font-weight: 600; }
  .mapa .saida-i { font-size: 15px; }
  .mapa .codigo { font-family: var(--f-mono); font-size: 14px; fill: var(--tinta-2); }
  .mapa .nome { font-size: 20px; font-weight: 600; }
  .mapa .papel-t { font-size: 13.5px; font-weight: 600; letter-spacing: .13em; fill: var(--tinta-2); }
  .mapa .desc { font-size: 15px; }
  .mapa .seta-t { font-size: 14px; font-weight: 600; fill: var(--tinta-2); }
  .mapa .item { font-size: 15.5px; }
  .mapa .forte { font-weight: 600; }
  .mapa .verif { font-size: 15px; }
  .mapa .rodape { font-size: 14.5px; fill: var(--tinta-2); }

  .ln { stroke: var(--tinta); fill: none; }
  .ln2 { stroke: var(--tinta-2); fill: none; }
  .regua { stroke: var(--regua); fill: none; }
  .fio { stroke: var(--cobre); fill: none; }
  .tr-laco { stroke: var(--laco); fill: none; stroke-dasharray: 6 5; stroke-width: 1.6; }
</style>

<div class="folha">
<figure>
<div class="rolagem">
<svg class="mapa" viewBox="0 0 1920 1080" role="img"
     aria-label="Mapa do predimref. Em cerca de 1 segundo a rotina transforma o pedido do cliente em parâmetros de partida coerentes para o Amesim. Faixa A: o pedido (capacidade, temperaturas, COP) passa por sete perguntas em ordem: gabinete e carga térmica, ciclo, compressor, trocadores, capilar, carga de fluido e partida com o gabinete quente, com três laços que voltam a etapas anteriores; um fio de cobre leva os números de um caso real de 200 litros até o bloco exportado ao Amesim. Faixa B: Gabriel entrega o bloco, Diego o liga ao Amesim pela API, Pedro reproduz o alvo e simula, o laboratório da IMBERA ensaia, e os ensaios calibram a rotina e o modelo.">
  <defs>
    <marker id="pt-tinta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#3e4b50"/>
    </marker>
    <marker id="pt-cobre" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#b4602b"/>
    </marker>
    <marker id="pt-laco" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#245d73"/>
    </marker>
  </defs>

  <!-- ================================================================ cabeçalho -->
  <text x="56" y="70" class="eyebrow">CAEXPERTS · IMBERA · SIMCENTER AMESIM · PRÉ-DIMENSIONAMENTO DE VISI-COOLERS</text>
  <text x="56" y="120" class="titulo"><tspan class="marca">predimref</tspan>: do pedido do cliente ao modelo no Amesim</text>
  <text x="56" y="155" class="tese">Em cerca de 1 s a rotina transforma o pedido em parâmetros de partida coerentes e conferidos pela física,
    o <tspan font-style="italic">step-down</tspan> do Amesim. Depois, o Amesim refina e o ensaio da IMBERA confirma.</text>

  <!-- ================================================================ faixa A -->
  <rect x="56" y="181" width="22" height="22" fill="#172226"/>
  <text x="67" y="197" class="letra" text-anchor="middle">A</text>
  <text x="90" y="197" class="secao">DENTRO DA ROTINA <tspan class="secao-nota">· sete perguntas, nesta ordem; o fio de cobre leva um caso real (200 L, 32 °C, alvo de 2,5 °C, COP 2,0, R290) do pedido ao Amesim</tspan></text>

  <!-- pedido, na ordem em que as entradas são usadas -->
  <rect x="56" y="216" width="184" height="410" rx="3" fill="#e5ebea"/>
  <line x1="56" y1="217" x2="240" y2="217" stroke="#172226" stroke-width="2"/>
  <text x="74" y="244" class="rot">O PEDIDO</text>
  <text x="74" y="282" class="ent-v">200 L</text>
  <text x="74" y="302" class="ent-r">ou garrafas de 600 mL</text>
  <text x="74" y="338" class="ent-v">32 °C</text>
  <text x="74" y="358" class="ent-r">temperatura ambiente</text>
  <text x="74" y="394" class="ent-v">2,5 °C</text>
  <text x="74" y="414" class="ent-r">temperatura alvo interna</text>
  <text x="74" y="450" class="ent-v">2,0</text>
  <text x="74" y="470" class="ent-r">COP desejado</text>
  <line x1="74" y1="494" x2="222" y2="494" class="regua"/>
  <text x="74" y="518" class="rot">OPCIONAIS (PADRÃO)</text>
  <text x="74" y="542" class="opc">ε dos trocadores (0,65)</text>
  <text x="74" y="563" class="opc">potência máx. (sem)</text>
  <text x="74" y="584" class="opc">fluido (R290)</text>
  <text x="74" y="605" class="opc">umidade ambiente (60 %)</text>

  <!-- etapas numeradas -->
  <g fill="#f2f5f4" stroke="#172226" stroke-width="1.6">
    <circle cx="362" cy="226" r="15"/><circle cx="546" cy="226" r="15"/><circle cx="730" cy="226" r="15"/>
    <circle cx="914" cy="226" r="15"/><circle cx="1098" cy="226" r="15"/><circle cx="1282" cy="226" r="15"/>
    <circle cx="1466" cy="226" r="15"/>
  </g>
  <g class="num" text-anchor="middle">
    <text x="362" y="231">1</text><text x="546" y="231">2</text><text x="730" y="231">3</text>
    <text x="914" y="231">4</text><text x="1098" y="231">5</text><text x="1282" y="231">6</text>
    <text x="1466" y="231">7</text>
  </g>

  <!-- perguntas -->
  <g class="perg" text-anchor="middle">
    <text x="362" y="272">Quanto cabe e<tspan x="362" dy="23">quanto calor entra?</tspan></text>
    <text x="546" y="272">Esse COP é<tspan x="546" dy="23">fisicamente possível?</tspan></text>
    <text x="730" y="272">Que compressor<tspan x="730" dy="23">entrega isso?</tspan></text>
    <text x="914" y="272">Que tamanho de<tspan x="914" dy="23">serpentina?</tspan></text>
    <text x="1098" y="272">Que capilar<tspan x="1098" dy="23">expande o fluido?</tspan></text>
    <text x="1282" y="272">Quantos gramas<tspan x="1282" dy="23">de fluido?</tspan></text>
    <text x="1466" y="272">E ao ligar com o<tspan x="1466" dy="23">gabinete quente?</tspan></text>
  </g>
  <g class="rot" text-anchor="middle">
    <text x="362" y="330">GABINETE</text><text x="546" y="330">CICLO</text><text x="730" y="330">COMPRESSOR</text>
    <text x="914" y="330">TROCADORES</text><text x="1098" y="330">CAPILAR</text><text x="1282" y="330">CARGA DE FLUIDO</text>
    <text x="1466" y="330">PULL-DOWN</text>
  </g>

  <!-- 1 gabinete: garrafas no envelope e calor entrando -->
  <rect x="336" y="347" width="58" height="76" class="ln" stroke-width="1.6"/>
  <g class="ln2" stroke-width="1">
    <circle cx="347" cy="358" r="4.3"/><circle cx="359" cy="358" r="4.3"/><circle cx="371" cy="358" r="4.3"/><circle cx="383" cy="358" r="4.3"/>
    <circle cx="347" cy="373" r="4.3"/><circle cx="359" cy="373" r="4.3"/><circle cx="371" cy="373" r="4.3"/><circle cx="383" cy="373" r="4.3"/>
    <circle cx="347" cy="388" r="4.3"/><circle cx="359" cy="388" r="4.3"/><circle cx="371" cy="388" r="4.3"/><circle cx="383" cy="388" r="4.3"/>
    <circle cx="347" cy="403" r="4.3"/><circle cx="359" cy="403" r="4.3"/><circle cx="371" cy="403" r="4.3"/><circle cx="383" cy="403" r="4.3"/>
    <line x1="300" y1="370" x2="330" y2="370" marker-end="url(#pt-tinta)"/>
    <line x1="300" y1="388" x2="330" y2="388" marker-end="url(#pt-tinta)"/>
    <line x1="300" y1="406" x2="330" y2="406" marker-end="url(#pt-tinta)"/>
    <line x1="430" y1="370" x2="400" y2="370" marker-end="url(#pt-tinta)"/>
    <line x1="430" y1="388" x2="400" y2="388" marker-end="url(#pt-tinta)"/>
  </g>
  <text x="330" y="358" class="eixo" text-anchor="end">paredes</text>
  <text x="400" y="358" class="eixo">porta</text>

  <!-- 2 ciclo: diagrama P-h -->
  <g class="ln2" stroke-width="1">
    <line x1="490" y1="424" x2="606" y2="424"/>
    <line x1="490" y1="424" x2="490" y2="347"/>
    <path d="M 500 423 Q 546 280 592 423"/>
  </g>
  <polygon points="517,405 593,405 612,371 517,371" class="ln" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="484" y="357" class="eixo" text-anchor="end">P</text>
  <text x="606" y="441" class="eixo" text-anchor="end">h</text>

  <!-- 3 compressor: cilindro, pistão, biela e manivela; cota do deslocamento -->
  <rect x="706" y="352" width="44" height="40" class="ln" stroke-width="1.6"/>
  <rect x="709" y="374" width="38" height="8" fill="#3e4b50"/>
  <line x1="728" y1="382" x2="737" y2="405" class="ln" stroke-width="1.6"/>
  <circle cx="728" cy="410" r="11" class="ln2" stroke-width="1"/>
  <circle cx="737" cy="405" r="2" fill="#172226"/>
  <g class="ln2" stroke-width="1.1">
    <polyline points="684,344 716,344 716,350" marker-end="url(#pt-tinta)"/>
    <polyline points="740,352 740,344 776,344" marker-end="url(#pt-tinta)"/>
    <line x1="758" y1="358" x2="758" y2="374"/>
    <line x1="754" y1="358" x2="762" y2="358"/>
    <line x1="754" y1="374" x2="762" y2="374"/>
  </g>
  <text x="766" y="371" class="eixo">V</text>
  <text x="680" y="349" class="eixo" text-anchor="end">suc.</text>
  <text x="780" y="349" class="eixo">desc.</text>

  <!-- 4 trocador tubo-aleta: aleta de placa vista de frente, 6 fileiras escalonadas, ar atravessando -->
  <g transform="translate(8,0)">
    <rect x="870" y="349" width="90" height="76" fill="#dde4e4" stroke="#9aa6aa" stroke-width="1"/>
    <g fill="#f2f5f4" stroke="#172226" stroke-width="1.3">
      <circle cx="878" cy="361" r="5"/><circle cx="878" cy="387" r="5"/><circle cx="878" cy="413" r="5"/>
      <circle cx="892" cy="374" r="5"/><circle cx="892" cy="400" r="5"/>
      <circle cx="906" cy="361" r="5"/><circle cx="906" cy="387" r="5"/><circle cx="906" cy="413" r="5"/>
      <circle cx="920" cy="374" r="5"/><circle cx="920" cy="400" r="5"/>
      <circle cx="934" cy="361" r="5"/><circle cx="934" cy="387" r="5"/><circle cx="934" cy="413" r="5"/>
      <circle cx="948" cy="374" r="5"/><circle cx="948" cy="400" r="5"/>
    </g>
    <g class="ln2" stroke-width="1.1">
      <line x1="838" y1="368" x2="864" y2="368" marker-end="url(#pt-tinta)"/>
      <line x1="838" y1="386" x2="864" y2="386" marker-end="url(#pt-tinta)"/>
      <line x1="838" y1="404" x2="864" y2="404" marker-end="url(#pt-tinta)"/>
    </g>
    <text x="838" y="359" class="eixo">ar</text>
  </g>

  <!-- 5 capilar: perfil real de pressão (líquido até o flash, depois bifásico acelerando) -->
  <g class="ln2" stroke-width="1">
    <line x1="1040" y1="424" x2="1158" y2="424"/>
    <line x1="1040" y1="424" x2="1040" y2="347"/>
  </g>
  <line x1="1070.6" y1="366" x2="1070.6" y2="424" class="regua" stroke-dasharray="2 2"/>
  <polyline points="1046,354 1070.6,359.8 1089.2,364.6 1105.4,370.2 1121.6,377.8 1132.4,384.9 1140.0,391.5 1145.4,397.9 1149.7,405.1 1152.4,412.0 1154,420"
            class="ln" stroke-width="1.8" stroke-linejoin="round"/>
  <text x="1034" y="357" class="eixo" text-anchor="end">P</text>
  <text x="1158" y="441" class="eixo" text-anchor="end">L</text>
  <text x="1066" y="390" class="eixo" text-anchor="end">líq.</text>
  <text x="1076" y="410" class="eixo">bifásico</text>

  <!-- 6 carga de fluido: barra em escala, 145 g frente aos 150 g da IEC de 2010 -->
  <rect x="1212" y="378" width="140" height="16" fill="#dde4e4"/>
  <rect x="1212" y="378" width="101.5" height="16" fill="#b4602b"/>
  <rect x="1212.5" y="378.5" width="139" height="15" fill="none" stroke="#3e4b50" stroke-width="1"/>
  <line x1="1317" y1="368" x2="1317" y2="402" class="ln" stroke-width="1.6"/>
  <text x="1317" y="362" class="eixo" text-anchor="middle">150 g (IEC 2010)</text>
  <text x="1212" y="414" class="eixo">0</text>
  <text x="1352" y="414" class="eixo" text-anchor="end">200 g</text>
  <text x="1282" y="436" class="eixo" text-anchor="middle">edições novas: até ≈ 494 g</text>

  <!-- 7 pull-down: potência do compressor (curva real do caso) -->
  <line x1="1396" y1="425" x2="1536" y2="425" class="ln2" stroke-width="1"/>
  <line x1="1396" y1="399.4" x2="1536" y2="399.4" class="ln2" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1396" y1="358" x2="1396" y2="368" stroke="#b4602b" stroke-width="1.2" stroke-dasharray="2 2"/>
  <polyline points="1396.0,369.0 1407.7,373.5 1419.3,377.7 1431.0,381.7 1442.7,385.4 1454.3,388.8 1466.0,392.1 1477.7,395.1 1489.3,397.9 1501.0,400.6 1512.7,403.0 1524.3,405.4 1536.0,407.5"
            class="fio" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>
  <circle cx="1396" cy="352.8" r="4.5" fill="#b4602b" stroke="#f2f5f4" stroke-width="2"/>
  <text x="1405" y="357" class="eixo-cobre">144 W na partida</text>
  <text x="1398" y="416" class="eixo">regime 109 W</text>
  <text x="1396" y="441" class="eixo">0 h</text>
  <text x="1536" y="441" class="eixo" text-anchor="end">12,3 h</text>

  <!-- fio do caso -->
  <line x1="240" y1="476" x2="1586" y2="476" class="fio" stroke-width="4" marker-end="url(#pt-cobre)"/>
  <g fill="#b4602b" stroke="#f2f5f4" stroke-width="2.5">
    <circle cx="362" cy="476" r="7.5"/><circle cx="546" cy="476" r="7.5"/><circle cx="730" cy="476" r="7.5"/>
    <circle cx="914" cy="476" r="7.5"/><circle cx="1098" cy="476" r="7.5"/><circle cx="1282" cy="476" r="7.5"/>
    <circle cx="1466" cy="476" r="7.5"/>
  </g>
  <g class="valor" text-anchor="middle">
    <text x="362" y="512">218 W</text>
    <text x="546" y="512">−7,5 / 45 °C</text>
    <text x="730" y="512">109 W</text>
    <text x="914" y="512">11,6 / 5,6 m</text>
    <text x="1098" y="512">0,711 mm</text>
    <text x="1282" y="512">145 g</text>
    <text x="1466" y="512">pico 144 W</text>
  </g>
  <g class="det" text-anchor="middle">
    <text x="362" y="536">108 garrafas (333 não cabem)</text>
    <text x="546" y="536">evaporação / condensação</text>
    <text x="730" y="536">elétricos: 218 W ÷ 2,0</text>
    <text x="914" y="536">de tubo: evap. / cond.</text>
    <text x="1098" y="536">(0,028") × 2,16 m de tubo</text>
    <text x="1282" y="536">de R290 no total</text>
    <text x="1466" y="536">pull-down ≈ 12 h (estimativa)</text>
  </g>
  <g class="met" text-anchor="middle">
    <text x="362" y="566">entram 139 W em média;<tspan x="362" dy="19">÷ 70 % de uso e + 10 %</tspan><tspan x="362" dy="19">de margem dão os 218 W</tspan></text>
    <text x="546" y="566">sim: 2,0 fica abaixo do<tspan x="546" dy="19">ciclo ideal (3,9) e de</tspan><tspan x="546" dy="19">Carnot (5,1); CoolProp</tspan></text>
    <text x="730" y="566">2,22 cm³ a 3500 rpm;<tspan x="730" dy="19">no catálogo (−10/45 °C),</tspan><tspan x="730" dy="19">≈ 198 W de frio</tspan></text>
    <text x="914" y="566">ε = 0,65 fixa o ar;<tspan x="914" dy="19">6 fileiras de tubo 3/8";</tspan><tspan x="914" dy="19">+10 % de área ao construir</tspan></text>
    <text x="1098" y="566">validado contra medição<tspan x="1098" dy="19">(Li et al., 1990): 1 a 3 %;</tspan><tspan x="1098" dy="19">±12,7 µm no Ø: ±5 % de ṁ</tspan></text>
    <text x="1282" y="566">123 g no circuito; o resto<tspan x="1282" dy="19">na carcaça e no óleo</tspan><tspan x="1282" dy="19">(vazio de Rouhani-Axelsson)</tspan></text>
    <text x="1466" y="566">quase estático, com a<tspan x="1466" dy="19">geometria fixa; o transitório</tspan><tspan x="1466" dy="19">real sai do Amesim</tspan></text>
  </g>

  <!-- laços: a rotina volta a uma etapa anterior até convergir -->
  <polyline points="908,618 908,640 546,640 546,620" class="tr-laco" marker-end="url(#pt-laco)"/>
  <text x="727" y="633" class="laco-t" text-anchor="middle">a queda de pressão volta à etapa 2</text>
  <polyline points="920,618 920,662 374,662 374,620" class="tr-laco" marker-end="url(#pt-laco)"/>
