[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "biokin"
version = "0.1.0"
description = "Discriminação de mecanismos cinéticos para produção de biodiesel em reatores monolíticos"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "sympy>=1.12",
]

[project.optional-dependencies]
figuras = ["matplotlib>=3.7"]
testes = ["pytest>=7.0"]

[project.scripts]
biokin = "biokin.cli:main"

[tool.setuptools.packages.find]
include = ["biokin*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::UserWarning"]
